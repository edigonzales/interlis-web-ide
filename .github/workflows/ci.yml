name: CI

on:
  push:
    branches: [main, "codex/**"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          path: interlis-web-ide
          persist-credentials: false
      - name: Read committed dependency lock
        id: lock
        working-directory: interlis-web-ide
        run: node scripts/release-metadata.mjs export-github-output --output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: edigonzales/interlis-language-tools
          ref: ${{ steps.lock.outputs.language_tools_sha }}
          path: interlis-language-tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: edigonzales/ilic-fork
          ref: ${{ steps.lock.outputs.compiler_sha }}
          path: ilic-fork
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            interlis-language-tools/pnpm-lock.yaml
            interlis-web-ide/pnpm-lock.yaml
      - name: Build and install exact locked dependencies
        working-directory: interlis-web-ide
        run: ./scripts/prepare-locked-dependencies.sh
      - name: Check and build Web IDE
        working-directory: interlis-web-ide
        run: pnpm check
      - uses: actions/upload-artifact@v6
        with:
          name: interlis-web-ide-runtime-${{ github.sha }}
          path: interlis-web-ide/dist
          if-no-files-found: error
          retention-days: 14
      - run: pnpm exec playwright install --with-deps chromium firefox
        working-directory: interlis-web-ide
      - run: pnpm e2e --project chromium --project firefox
        working-directory: interlis-web-ide
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: interlis-web-ide-linux-e2e-${{ github.sha }}
          path: |
            interlis-web-ide/playwright-report
            interlis-web-ide/test-results
          if-no-files-found: ignore
          retention-days: 14

  webkit:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: interlis-web-ide
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: interlis-web-ide/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: interlis-web-ide
      - uses: actions/download-artifact@v7
        with:
          name: interlis-web-ide-runtime-${{ github.sha }}
          path: interlis-web-ide/dist
      - run: pnpm exec playwright install webkit
        working-directory: interlis-web-ide
      - run: pnpm e2e --project webkit
        working-directory: interlis-web-ide
        env:
          PLAYWRIGHT_PREBUILT: "1"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: interlis-web-ide-webkit-e2e-${{ github.sha }}
          path: |
            interlis-web-ide/playwright-report
            interlis-web-ide/test-results
          if-no-files-found: ignore
          retention-days: 14
