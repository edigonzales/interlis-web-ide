name: Deploy GitHub Pages

on:
  repository_dispatch:
    types: [release-train-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: interlis-web-ide
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: edigonzales/interlis-language-tools
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.language_tools_sha || 'main' }}
          path: interlis-language-tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: edigonzales/ilic-fork
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.compiler_sha || 'main' }}
          path: ilic-fork
          persist-credentials: false
      - name: Resolve and validate release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMPILER_SHA: ${{ github.event.client_payload.compiler_sha }}
          EVENT_LANGUAGE_TOOLS_SHA: ${{ github.event.client_payload.language_tools_sha }}
          EVENT_COMPILER_VERSION: ${{ github.event.client_payload.compiler_version }}
          EVENT_LANGUAGE_TOOLS_VERSION: ${{ github.event.client_payload.language_tools_version }}
          EVENT_COMPILER_TIMESTAMP: ${{ github.event.client_payload.compiler_timestamp }}
          EVENT_COMPILER_BUILD_ID: ${{ github.event.client_payload.compiler_build_id }}
          EVENT_LANGUAGE_TIMESTAMP: ${{ github.event.client_payload.language_timestamp }}
          EVENT_LANGUAGE_BUILD_ID: ${{ github.event.client_payload.language_build_id }}
          EVENT_RELEASE_RUN_ID: ${{ github.event.client_payload.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          actual_compiler_sha=$(git -C ilic-fork rev-parse HEAD)
          actual_language_tools_sha=$(git -C interlis-language-tools rev-parse HEAD)
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            node interlis-web-ide/scripts/validate-release-metadata.mjs \
              --compiler-sha "$EVENT_COMPILER_SHA" \
              --language-tools-sha "$EVENT_LANGUAGE_TOOLS_SHA" \
              --compiler-version "$EVENT_COMPILER_VERSION" \
              --language-tools-version "$EVENT_LANGUAGE_TOOLS_VERSION" \
              --compiler-timestamp "$EVENT_COMPILER_TIMESTAMP" \
              --compiler-build-id "$EVENT_COMPILER_BUILD_ID" \
              --language-timestamp "$EVENT_LANGUAGE_TIMESTAMP" \
              --language-build-id "$EVENT_LANGUAGE_BUILD_ID" \
              --release-run-id "$EVENT_RELEASE_RUN_ID" \
              --checked-out-compiler-sha "$actual_compiler_sha" \
              --checked-out-language-tools-sha "$actual_language_tools_sha" \
              --compiler-cmake ilic-fork/CMakeLists.txt \
              --language-tools-package interlis-language-tools/package.json \
              --github-output "$GITHUB_OUTPUT"
          else
            compiler_sha=$(git -C ilic-fork rev-parse HEAD)
            language_tools_sha=$(git -C interlis-language-tools rev-parse HEAD)
            compiler_version=$(node --input-type=module -e '
              import { readFile } from "node:fs/promises";
              import { readIlicProjectVersion } from "./interlis-web-ide/scripts/validate-release-metadata.mjs";
              process.stdout.write(readIlicProjectVersion(await readFile("ilic-fork/CMakeLists.txt", "utf8")));
            ')
            language_timestamp=$(date -u +%Y%m%d%H%M%S)
            language_build_id="$GITHUB_RUN_ID"
            language_base_version=$(node -p "require('./interlis-language-tools/package.json').version")
            language_tools_version="${language_base_version}-SNAPSHOT.${language_timestamp}.${language_build_id}"
            {
              echo "compiler_sha=$compiler_sha"
              echo "language_tools_sha=$language_tools_sha"
              echo "compiler_version=$compiler_version"
              echo "language_tools_version=$language_tools_version"
              echo "language_timestamp=$language_timestamp"
              echo "language_build_id=$language_build_id"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            interlis-language-tools/pnpm-lock.yaml
            interlis-web-ide/pnpm-lock.yaml
      - name: Build pinned compiler WASM
        shell: bash
        working-directory: ilic-fork
        env:
          ILIC_WASM_VERSION: ${{ steps.metadata.outputs.compiler_version }}
        run: |
          set -euo pipefail
          emscripten_version=$(tr -d '[:space:]' < .emscripten-version)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$emscripten_version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$emscripten_version"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh
      - name: Build cross-repository npm tarballs
        working-directory: interlis-language-tools
        env:
          SNAPSHOT_TIMESTAMP: ${{ steps.metadata.outputs.language_timestamp }}
          SNAPSHOT_BUILD_ID: ${{ steps.metadata.outputs.language_build_id }}
          COMPILER_VERSION: ${{ steps.metadata.outputs.compiler_version }}
          COMPILER_SHA: ${{ steps.metadata.outputs.compiler_sha }}
          LANGUAGE_TOOLS_VERSION: ${{ steps.metadata.outputs.language_tools_version }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm pack:verify
      # CI enables frozen-lockfile by default, but these local release tarballs
      # need their runner-local checksums resolved from the generated bytes.
      - run: pnpm install --no-frozen-lockfile --force --update-checksums
        working-directory: interlis-web-ide
      - run: pnpm check
        working-directory: interlis-web-ide
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: interlis-web-ide/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
