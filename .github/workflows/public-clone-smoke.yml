name: Public clone smoke

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: interlis-web-ide
          persist-credentials: false
      - name: Read committed dependency lock
        id: lock
        working-directory: interlis-web-ide
        run: node scripts/release-metadata.mjs export-github-output --output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: edigonzales/interlis-language-tools
          ref: ${{ steps.lock.outputs.language_tools_sha }}
          path: interlis-language-tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: edigonzales/ilic-fork
          ref: ${{ steps.lock.outputs.compiler_sha }}
          path: ilic-fork
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            interlis-language-tools/pnpm-lock.yaml
            interlis-web-ide/pnpm-lock.yaml
      - name: Build and install exact locked dependencies
        working-directory: interlis-web-ide
        run: ./scripts/prepare-locked-dependencies.sh
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: interlis-web-ide
      - run: pnpm e2e:public-clone --project chromium
        working-directory: interlis-web-ide
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: public-clone-failure-${{ github.sha }}
          path: interlis-web-ide/test-results
          if-no-files-found: ignore
