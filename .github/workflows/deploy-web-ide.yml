name: Deploy Web IDE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: interlis-web-ide
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Read committed dependency lock
        id: lock
        working-directory: interlis-web-ide
        run: node scripts/release-metadata.mjs export-github-output --output "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: interlis-web-ide/pnpm-lock.yaml
      - name: Select release channel
        id: release
        working-directory: interlis-web-ide
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v${{ steps.lock.outputs.artifact_base_version }}"
            channel=stable
          else
            test "$GITHUB_REF" = refs/heads/main
            channel=snapshot
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install exact published dependencies
        working-directory: interlis-web-ide
        run: pnpm install --frozen-lockfile
      - name: Verify installed package provenance
        working-directory: interlis-web-ide
        run: pnpm release:verify-installed
      - name: Check and build Web IDE
        working-directory: interlis-web-ide
        run: pnpm check
      - name: Write release provenance
        working-directory: interlis-web-ide
        shell: bash
        run: |
          set -euo pipefail
          args=(manifest --source-sha "$GITHUB_SHA" --channel "${{ steps.release.outputs.channel }}" --run-id "$GITHUB_RUN_ID" --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --toolchain "node-$(node -p 'process.versions.node')" --output dist/interlis-release.json)
          if [[ "${{ steps.release.outputs.channel }}" == stable ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          node scripts/release-metadata.mjs "${args[@]}"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: interlis-web-ide/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
